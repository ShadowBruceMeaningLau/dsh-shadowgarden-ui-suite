<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub · 面板</title>
    <style>
      :root {
        --bg: #07070d;
        --panel: rgba(167, 139, 250, 0.06);
        --border: rgba(139, 92, 246, 0.22);
        --text: #e8e8f4;
        --dim: #9a9ab8;
        --accent: #8b5cf6;
        --accent2: #c4b5fd;
        --danger: #f43f5e;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        padding: 12px;
      }
      ::selection { background: rgba(139, 92, 246, 0.4); }
      h1 { font-size: 15px; color: var(--accent2); letter-spacing: 0.5px; margin-bottom: 10px; }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 10px;
      }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      input {
        flex: 1;
        min-width: 170px;
        background: #12121f;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 7px 10px;
        font-size: 13px;
      }
      input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18); }
      button {
        background: linear-gradient(135deg, #8b5cf6, #5b21b6);
        color: #f5f3ff;
        border: 0;
        border-radius: 8px;
        padding: 7px 14px;
        cursor: pointer;
        font-size: 13px;
      }
      .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
      .tab {
        flex: 1;
        background: rgba(139, 92, 246, 0.08);
        color: var(--dim);
        border: 1px solid transparent;
        border-radius: 9px;
        padding: 7px;
        cursor: pointer;
        text-align: center;
      }
      .tab.active { background: rgba(139, 92, 246, 0.18); color: var(--accent2); border-color: var(--border); }
      .item { border-bottom: 1px solid rgba(139, 92, 246, 0.12); padding: 9px 2px; }
      .item:last-child { border-bottom: 0; }
      .item .t { font-weight: 600; }
      .item .t a { color: var(--text); text-decoration: none; }
      .item .t a:hover { color: var(--accent2); }
      .item .d { color: var(--dim); font-size: 12px; margin-top: 3px; }
      .meta { color: var(--dim); font-size: 12px; display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
      .badge { background: rgba(139, 92, 246, 0.15); color: var(--accent2); border-radius: 6px; padding: 1px 7px; font-size: 11px; }
      .badge.red { background: rgba(225, 29, 72, 0.15); color: #fda4af; }
      .badge.green { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
      .av { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--accent); background: #12121f; }
      .hint { color: var(--dim); font-size: 12px; }
      .err {
        color: #fda4af;
        background: rgba(225, 29, 72, 0.1);
        border: 1px solid rgba(225, 29, 72, 0.3);
        border-radius: 9px;
        padding: 9px 12px;
        margin-bottom: 10px;
      }
      .loading { color: var(--dim); padding: 14px; text-align: center; }
      /* 流动能量描边 */
      @property --gh-flow { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
      .card { position: relative; }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        padding: 1.5px;
        border-radius: 12px;
        background: conic-gradient(from var(--gh-flow), transparent 0deg, #8b5cf6 70deg, #a78bfa 140deg, transparent 210deg, #e11d48 280deg, transparent 360deg);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude;
        opacity: 0.45;
        animation: gh-flow 7s linear infinite;
        pointer-events: none;
      }
      @keyframes gh-flow { to { --gh-flow: 360deg; } }
    </style>
  </head>
  <body>
    <h1>GitHub 面板</h1>
    <div class="card">
      <div class="row">
        <input id="user" placeholder="GitHub 用户名（可选）" />
        <input id="token" type="password" placeholder="Personal Access Token（可选）" />
        <button id="save">保存</button>
      </div>
      <div class="hint" style="margin-top: 8px">
        Token 仅保存在本机浏览器 localStorage，只发送给 api.github.com。匿名访问限 60 次/小时；通知与 Issues 需要 Token。
      </div>
    </div>
    <div id="errBox"></div>
    <div class="card" id="profile" style="display: none">
      <div class="row">
        <img class="av" id="avatar" alt="avatar" />
        <div>
          <div class="t" id="name">—</div>
          <div class="hint" id="login">—</div>
        </div>
      </div>
      <div class="meta" id="stats"></div>
    </div>
    <div class="tabs">
      <div class="tab active" data-k="repos">仓库</div>
      <div class="tab" data-k="notifs">通知</div>
      <div class="tab" data-k="issues">Issues</div>
    </div>
    <div class="card" id="list"><div class="hint">输入用户名或 Token 后点击"仓库"加载。</div></div>
    <div class="hint" id="rate"></div>
    <script>
      (function () {
        "use strict";
        var $ = function (id) { return document.getElementById(id); };
        var user = localStorage.getItem("gh-user") || "";
        var token = localStorage.getItem("gh-token") || "";
        $("user").value = user;
        $("token").value = token;
        var cache = {};

        function showErr(msg) {
          var b = $("errBox");
          b.textContent = msg || "";
          b.style.display = msg ? "" : "none";
          b.className = "err";
        }

        function api(path) {
          var headers = { Accept: "application/vnd.github+json" };
          if (token) headers.Authorization = "Bearer " + token;
          return fetch("https://api.github.com" + path, { headers: headers }).then(function (res) {
            if (res.status === 401) throw new Error("Token 无效或未授权（401）");
            if (res.status === 403) throw new Error("API 限流或权限不足（403）。匿名访问限 60 次/小时");
            if (!res.ok) throw new Error("GitHub API 错误：" + res.status);
            var remain = res.headers.get("x-ratelimit-remaining");
            if (remain !== null && remain !== undefined) $("rate").textContent = "API 剩余配额: " + remain;
            return res.json();
          });
        }

        function loadProfile() {
          if (!token && !user) return;
          var p = token ? api("/user") : api("/users/" + encodeURIComponent(user));
          p.then(function (u) {
            $("profile").style.display = "";
            $("avatar").src = u.avatar_url || "";
            $("name").textContent = u.name || u.login;
            $("login").textContent = "@" + u.login + (u.bio ? " · " + u.bio : "");
            $("stats").innerHTML =
              "<span>仓库 <b>" + u.public_repos + "</b></span>" +
              "<span>关注 <b>" + u.followers + "</b></span>" +
              "<span>粉丝 <b>" + u.following + "</b></span>";
          }).catch(function (e) { showErr(e.message); });
        }

        function esc(s) {
          return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
        }

        function relTime(s) {
          var t = new Date(s).getTime();
          if (!t) return "";
          var d = Math.floor((Date.now() - t) / 86400000);
          if (d <= 0) return "今天";
          if (d === 1) return "昨天";
          if (d < 30) return d + " 天前";
          return new Date(s).toLocaleDateString();
        }

        function renderRepos(list) {
          if (!list.length) { $("list").innerHTML = '<div class="hint">没有仓库。</div>'; return; }
          $("list").innerHTML = list.map(function (r) {
            return '<div class="item">' +
              '<div class="t"><a href="' + esc(r.html_url) + '" target="_blank" rel="noopener">' + esc(r.full_name) + "</a>" +
              (r.private ? ' <span class="badge red">私有</span>' : "") +
              (r.fork ? ' <span class="badge">fork</span>' : "") + "</div>" +
              (r.description ? '<div class="d">' + esc(r.description) + "</div>" : "") +
              '<div class="meta">' +
              (r.language ? "<span>" + esc(r.language) + "</span>" : "") +
              "<span>★ " + r.stargazers_count + "</span>" +
              "<span>更新于 " + relTime(r.updated_at) + "</span></div></div>";
          }).join("");
        }

        function notifUrl(n) {
          if (!n.subject || !n.subject.url) return "#";
          return n.subject.url
            .replace("api.github.com/repos", "github.com")
            .replace("/pulls/", "/pull/");
        }

        function renderNotifs(list) {
          if (!list.length) { $("list").innerHTML = '<div class="hint">没有未读通知（清爽！）。</div>'; return; }
          $("list").innerHTML = list.map(function (n) {
            return '<div class="item">' +
              '<div class="t"><a href="' + esc(notifUrl(n)) + '" target="_blank" rel="noopener">' + esc(n.subject.title) + "</a></div>" +
              '<div class="d">' + esc(n.repository.full_name) + " · " + esc(n.reason) + " · " + relTime(n.updated_at) + "</div></div>";
          }).join("");
        }

        function renderIssues(list) {
          if (!list.length) { $("list").innerHTML = '<div class="hint">没有分配给你的 Issue。</div>'; return; }
          $("list").innerHTML = list.map(function (i) {
            var cls = i.state === "open" ? "badge green" : "badge";
            var repo = (i.repository_url || "").split("/repos/")[1] || "";
            return '<div class="item">' +
              '<div class="t"><a href="' + esc(i.html_url) + '" target="_blank" rel="noopener">' + esc(i.title) + "</a> <span class=\"" + cls + '">' + esc(i.state) + "</span></div>" +
              '<div class="d">' + esc(repo) + " · 更新于 " + relTime(i.updated_at) + "</div></div>";
          }).join("");
        }

        var loaders = { repos: renderRepos, notifs: renderNotifs, issues: renderIssues };

        function load(k) {
          showErr("");
          if (cache[k]) { loaders[k](cache[k]); return; }
          if (!token && !user) {
            $("list").innerHTML = '<div class="hint">请先输入用户名或 Token 并保存。</div>';
            return;
          }
          $("list").innerHTML = '<div class="loading">加载中…</div>';
          var paths = {
            repos: token
              ? "/user/repos?sort=updated&per_page=20"
              : "/users/" + encodeURIComponent(user) + "/repos?sort=updated&per_page=20",
            notifs: "/notifications?per_page=20",
            issues: "/user/issues?per_page=20"
          };
          api(paths[k]).then(function (data) {
            cache[k] = Array.isArray(data) ? data : [];
            loaders[k](cache[k]);
          }).catch(function (e) {
            if (!token && (k === "notifs" || k === "issues")) {
              $("list").innerHTML = '<div class="hint">' + (k === "notifs" ? "通知" : "Issues") + " 需要 Token（匿名 API 不提供）。填写 Token 后重试。</div>";
              return;
            }
            $("list").innerHTML = '<div class="err">' + esc(e.message) + "</div>";
          });
        }

        $("save").addEventListener("click", function () {
          user = $("user").value.trim();
          token = $("token").value.trim();
          localStorage.setItem("gh-user", user);
          localStorage.setItem("gh-token", token);
          cache = {};
          showErr("");
          loadProfile();
          load("repos");
        });

        var tabs = document.querySelectorAll(".tab");
        for (var i = 0; i < tabs.length; i++) {
          tabs[i].addEventListener("click", function () {
            for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove("active");
            this.classList.add("active");
            load(this.dataset.k);
          });
        }

        loadProfile();
        load("repos");
      })();
    </script>
  </body>
</html>
