<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>服务中心</title>
    <style>
      :root {
        --bg: #07070d;
        --panel: rgba(167, 139, 250, 0.06);
        --border: rgba(139, 92, 246, 0.22);
        --text: #e8e8f4;
        --dim: #9a9ab8;
        --accent: #8b5cf6;
        --accent2: #c4b5fd;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        padding: 16px;
      }
      h1 { font-size: 15px; color: var(--accent2); letter-spacing: 0.5px; margin-bottom: 4px; }
      .hint { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
      .card {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 10px;
        text-decoration: none;
        transition: border-color 0.2s, background 0.2s, transform 0.15s;
      }
      .card:hover {
        border-color: rgba(167, 139, 250, 0.55);
        background: rgba(139, 92, 246, 0.1);
        transform: translateX(3px);
      }
      .card .ico {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        color: #f5f3ff;
      }
      .card .ico svg { width: 19px; height: 19px; fill: #f5f3ff; }
      .card .t { font-weight: 600; color: var(--text); font-size: 13.5px; }
      .card .d { color: var(--dim); font-size: 12px; margin-top: 1px; }
      .card .go { margin-left: auto; color: var(--dim); }
    </style>
  </head>
  <body>
    <h1>服务中心</h1>
    <div class="hint">点击后在共享的 Edge 窗口中新开标签页（外部站点禁止内嵌，无法直接显示在本页内）</div>

    <a class="card" href="dshhub://chat.deepseek.com/">
      <span class="ico" style="background: linear-gradient(135deg, #4d6bfe, #1e40af);">
        <svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-4 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><circle cx="8.5" cy="10.5" r="1.3"/><circle cx="12" cy="10.5" r="1.3"/><circle cx="15.5" cy="10.5" r="1.3"/></svg>
      </span>
      <span><div class="t">DeepSeek Chat</div><div class="d">官方对话（chat.deepseek.com）</div></span>
      <span class="go">→</span>
    </a>

    <a class="card" href="dshhub://platform.deepseek.com/usage">

      </span>
      <span><div class="t">API 用量</div><div class="d">DeepSeek 平台用量页（platform.deepseek.com/usage）</div></span>
      <span class="go">→</span>
    </a>

  </body>
</html>
